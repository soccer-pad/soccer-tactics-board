<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전자 축구작전판</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>⚽ 전자 축구작전판</h1>

  <div class="app-shell">
    <div class="stage">
      <div class="board-wrap" id="boardWrap">
        <canvas id="board" width="940" height="644"></canvas>
      </div>
      <div class="zoom-controls">
        <button id="zoomOutBtn" class="small-btn">− 축소</button>
        <span id="zoomLabel" class="zoom-label">100%</span>
        <button id="zoomInBtn" class="small-btn">+ 확대</button>
        <button id="zoomResetBtn" class="small-btn">원본</button>
      </div>
      <p class="hint" id="hint">이동 모드: 드래그해서 옮기세요. 더블클릭(또는 길게 누르기)하거나 삭제 영역으로 끌면 삭제됩니다. 확대 중엔 손가락 두 개로 오므리거나 벌려서 확대/이동하세요.</p>
    </div>

    <div id="trashZone" class="trash-zone">🗑️ 여기로 끌어서 삭제</div>

    <aside class="sidebar">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="team">👥 팀</button>
        <button class="tab-btn" data-tab="equip">🧰 용품</button>
        <button class="tab-btn" data-tab="line">➰ 방향선</button>
        <button class="tab-btn" data-tab="text">📝 설명</button>
        <button class="tab-btn" data-tab="option">⚙️ 옵션</button>
        <button class="tab-btn" data-tab="save">💾 저장</button>
      </div>

      <div class="tab-panels">
        <!-- 팀 -->
        <section class="tab-panel active" data-panel="team">
          <div class="panel-head">
            <span>팀</span>
            <button id="addTeamBtn" class="small-btn accent">+ 팀 추가</button>
          </div>
          <div id="teamsPanel" class="teams-panel"></div>
          <div class="total-count">총 선수: <span id="totalCount">0</span> / 40</div>
        </section>

        <!-- 용품 -->
        <section class="tab-panel" data-panel="equip">
          <div class="panel-head"><span>훈련 용품 (드래그하거나 "+추가")</span></div>
          <div id="equipControls" class="goal-controls" style="display:none">
            <div class="equip-title" id="equipControlsTitle">선택된 용품 — 크기</div>
            <div class="row-actions">
              <button id="equipSmaller" class="small-btn">− 크기</button>
              <button id="equipBigger" class="small-btn">+ 크기</button>
              <button id="equipRotateBtn" class="small-btn">↻ 회전</button>
              <button id="equipDeselect" class="small-btn">선택 해제</button>
            </div>
          </div>
          <div id="equipmentPanel" class="equipment-panel"></div>
        </section>

        <!-- 방향선 -->
        <section class="tab-panel" data-panel="line">
          <div class="panel-head"><span>선 그리기</span></div>
          <div class="group">
            <label>선 종류</label>
            <div class="row-actions wrap" id="lineTypePanel">
              <button class="small-btn line-type-btn active" data-value="solid">실선</button>
              <button class="small-btn line-type-btn" data-value="dashed">점선</button>
              <button class="small-btn line-type-btn" data-value="freehand">자유곡선</button>
              <button class="small-btn line-type-btn" data-value="freehand-dashed">자유곡선(점선)</button>
            </div>
          </div>
          <div class="group">
            <label>선 색상</label>
            <div id="lineColorPanel" class="swatch-row"></div>
          </div>
          <div class="row-actions wrap">
            <button id="undoBtn" class="small-btn">되돌리기</button>
            <button id="clearArrowsBtn" class="small-btn">선 지우기</button>
          </div>
        </section>

        <!-- 설명 (텍스트) -->
        <section class="tab-panel" data-panel="text">
          <div class="panel-head"><span>필드에 텍스트 라벨 추가</span></div>
          <div class="row-actions">
            <input type="text" id="textInput" placeholder="" maxlength="20" />
            <button id="addTextBtn" class="small-btn accent">+ 추가</button>
          </div>
          <div id="textList" class="text-list"></div>
        </section>

        <!-- 옵션 -->
        <section class="tab-panel" data-panel="option">
          <div class="panel-head"><span>모드</span></div>
          <div class="row-actions wrap">
            <button id="modeBtn" class="mode-move">이동 모드</button>
            <button id="gridToggleBtn" class="small-btn">▦ 격자 표시</button>
          </div>

          <div class="panel-head sub"><span>필드 모드</span></div>
          <div class="group">
            <label>축구장 종류</label>
            <select id="pitchModeSelect">
              <option value="full">정규 축구장 (가로)</option>
              <option value="half">하프 코트 (세로)</option>
            </select>
          </div>
          <div class="group" id="halfGoalGroup" style="display:none">
            <label>골대 위치</label>
            <select id="halfGoalSelect">
              <option value="bottom">아래</option>
              <option value="top">위</option>
            </select>
          </div>

          <div class="panel-head sub"><span>구역 표시</span></div>
          <div class="group">
            <label>가로 구역 (공격 - 미들 - 수비)</label>
            <select id="lengthZoneSelect">
              <option value="0">없음</option>
              <option value="3">3등분</option>
              <option value="4">4등분</option>
              <option value="5">5등분</option>
            </select>
          </div>
          <div class="group">
            <label>세로 구역 (왼쪽 - 중앙 - 오른쪽)</label>
            <select id="widthZoneSelect">
              <option value="0">없음</option>
              <option value="3">3등분</option>
              <option value="4">4등분</option>
              <option value="5">5등분</option>
            </select>
          </div>

          <div class="panel-head sub"><span>기타</span></div>
          <div class="row-actions wrap">
            <button id="resetBtn" class="small-btn">전체 초기화</button>
          </div>
        </section>

        <!-- 저장 -->
        <section class="tab-panel" data-panel="save">
          <div class="panel-head"><span>작전 저장</span></div>
          <div class="row-actions">
            <input type="text" id="saveNameInput" placeholder="작전 이름 (예: 수비 전환)" maxlength="30" />
            <button id="saveBoardBtn" class="small-btn accent">저장</button>
          </div>
          <div id="savesList" class="save-list"></div>
          <div class="panel-head sub"><span>기타</span></div>
          <div class="row-actions wrap">
            <button id="exportBtn" class="small-btn">이미지로 저장</button>
          </div>
        </section>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
